[package]
name = "aaa-daemon"
version = "1.6.2"
edition = "2021"
description = "AAA daemon: PTY pool + server-side VT for AI agent sessions (REST + WS)"

[[bin]]
name = "aaa-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
portable-pty = "0.9"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.9"
libc = "0.2"
if-addrs = "0.13"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
