apply plugin: 'com.android.library'

android {
    namespace "com.termux.emulator"
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    defaultConfig { minSdkVersion project.properties.minSdkVersion.toInteger(); targetSdkVersion project.properties.targetSdkVersion.toInteger() }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation "androidx.annotation:annotation:1.9.0"; testImplementation "junit:junit:4.13.2" }
