[package]
name = "aaa-ui-mac"
version = "1.11.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# gpui 锁定 zed tag v1.17.2 = commit c8e44cfa7bda9b2e22c8d6934d78969352e7f61a
# 该 rev 上 gpui 已拆分为 gpui + gpui_platform/gpui_macos/gpui_apple；
# runtime_shaders feature 位于 gpui_platform（转发到 gpui_macos -> gpui_apple），
# 作用等价于旧版 gpui 的 runtime_shaders：运行时拼接/编译 Metal shader，
# 无需完整 Xcode 的 `xcrun metal`（本机仅 CommandLineTools）。
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.17.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.17.2", features = [
    "runtime_shaders",
    "font-kit",
] }

# 终端 VT 模型（Apache-2.0，Zed/tty7 同款）；渲染层自研，不使用 Zed 的 GPL terminal_view
alacritty_terminal = "0.26"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
    "io-util",
] }
tokio-tungstenite = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
futures = "0.3"
anyhow = "1"
# Markdown → 块模型（消息流里 assistant 文本按 CommonMark 渲染）；表格/删除线在解析时用 Options 打开
pulldown-cmark = { version = "0.13", default-features = false }
qrcode = { version = "0.14", default-features = false }
dirs = "6"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationSettings", "UNNotificationTrigger", "block2"] }

[profile.dev]
# gpui 全量 debug 信息体积巨大，行号足够排错
debug = "line-tables-only"

[profile.release]
# Zed 发布同款 thin LTO：跨 crate 内联（px 换算/颜色转换等渲染热路径都跨 crate），
# 二进制更小 → 冷启动加载更快；debuginfo 剥离进一步减体积
lto = "thin"
strip = "debuginfo"
